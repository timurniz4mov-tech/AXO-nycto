name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Forge MDK
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk-work
          unzip -q mdk.zip -d mdk-work

      - name: Install mod sources into MDK
        run: |
          MDK=$(dirname "$(find mdk-work -name gradlew | head -1)")
          HE=$(find . -name HollowEcho.java -not -path './mdk-work/*' | head -1)
          if [ -z "$HE" ]; then echo "ERROR: HollowEcho.java not found in repository - upload the src folder"; exit 1; fi
          SRC=${HE%/main/java/*}
          echo "MDK=$MDK" >> $GITHUB_ENV
          echo "Mod sources: $SRC"
          rm -rf "$MDK/src/main/java/com/example"
          rm -f "$MDK/src/main/resources/META-INF/mods.toml"
          cp -r "$SRC/." "$MDK/src/"
          sed -i 's/^mod_id=.*/mod_id=hollowecho/' "$MDK/gradle.properties"
          test -f "$MDK/src/main/resources/META-INF/mods.toml" || { echo "ERROR: mods.toml missing"; exit 1; }
          test -f "$MDK/src/main/java/com/hollowecho/HollowEcho.java" || { echo "ERROR: HollowEcho.java not copied"; exit 1; }

      - name: Build
        run: |
          cd "$MDK"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check jar contents
        run: |
          cd "$MDK/build/libs"
          ls -la
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in *.jar; do
            case "$f" in *sources*|*slim*) continue;; esac
            echo "== $f =="
            unzip -l "$f" | grep -E "mods.toml|HollowEcho.class|KeeperEntity.class|lighthouse.nbt" || true
            unzip -l "$f" | grep -q "com/hollowecho/HollowEcho.class" || { echo "ERROR: mod classes missing in jar"; exit 1; }
            unzip -l "$f" | grep -q "META-INF/mods.toml" || { echo "ERROR: mods.toml missing in jar"; exit 1; }
            cp "$f" "$GITHUB_WORKSPACE/out/"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hollowecho-jar
          path: out/*.jar
          if-no-files-found: error
